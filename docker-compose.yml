# The app runs here; whisper.cpp runs on the box that owns the GPU, and Ollama writes the
# episode summaries — usually on that same box, since it is the one with the VRAM.
#
# Whisper__BaseUrl is the only setting that has to be right for transcription to work.
# Point it at whisper-server wherever it lives — a Windows machine with the NVIDIA card,
# another host, or a sidecar container. Copy .env.example to .env and set it there.
#
# Start whisper-server on the GPU box with something like:
#   whisper-server.exe -m models/ggml-large-v3-turbo-q5_0.bin --host 0.0.0.0 --port 8080
# and make sure its firewall lets this host reach that port.
#
# Summaries are optional and off until asked for. To turn them on, set OLLAMA_ENABLED=true and
# point OLLAMA_BASE_URL at an Ollama server, having pulled the model there first:
#   ollama serve
#   ollama pull llama3.1:8b
# Ollama binds to 127.0.0.1 by default, so it needs OLLAMA_HOST=0.0.0.0 to be reachable from
# this container. The Settings page has a connection test for it, as it does for whisper.

services:
  transcriber:
    build:
      context: .
      dockerfile: Dockerfile
    image: podcast-transcription:latest
    container_name: podcast-transcriber
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production

      # Where whisper-server is actually running.
      Whisper__BaseUrl: "${WHISPER_BASE_URL:-http://host.docker.internal:8080}"
      # Must match the model whisper-server was started with; recorded against each transcript.
      Whisper__Model: "${WHISPER_MODEL:-large-v3-turbo-q5_0}"
      Whisper__Language: "${WHISPER_LANGUAGE:-auto}"
      # A long file is one long request. The 100 s HttpClient default would fail every episode.
      Whisper__RequestTimeoutMinutes: "${WHISPER_TIMEOUT_MINUTES:-120}"

      # ---- Ollama: agentic episode summaries ----
      # Off unless asked for, so a host without an Ollama does not fail a call after every job.
      Ollama__Enabled: "${OLLAMA_ENABLED:-false}"
      Ollama__BaseUrl: "${OLLAMA_BASE_URL:-http://host.docker.internal:11434}"
      # Must already be pulled on that server: `ollama pull <model>`.
      Ollama__Model: "${OLLAMA_MODEL:-llama3.1:8b}"
      # Summarise as the last step of every job. False leaves it to the button on the episode page.
      Ollama__AutoSummarize: "${OLLAMA_AUTO_SUMMARIZE:-true}"
      # Ollama's own default context is 2048 tokens, which silently truncates anything
      # episode-sized. Raise both together: the window has to fit inside the context.
      Ollama__ContextTokens: "${OLLAMA_CONTEXT_TOKENS:-8192}"
      Ollama__MaxWindowChars: "${OLLAMA_WINDOW_CHARS:-12000}"
      Ollama__MaxOutputTokens: "${OLLAMA_MAX_OUTPUT_TOKENS:-1200}"
      Ollama__Temperature: "${OLLAMA_TEMPERATURE:-0.2}"
      # A long episode is several generate calls back to back; a CPU-only model is slow.
      Ollama__RequestTimeoutMinutes: "${OLLAMA_TIMEOUT_MINUTES:-30}"
      # Optional steer appended to the summary instructions — host names, house style, anything.
      Ollama__ExtraInstructions: "${OLLAMA_EXTRA_INSTRUCTIONS:-}"

      # The app refuses to start with auth enabled and no password configured.
      Auth__Enabled: "${AUTH_ENABLED:-true}"
      Auth__Username: "${ADMIN_USERNAME:-admin}"
      Auth__Password: "${ADMIN_PASSWORD:-}"
      Auth__PasswordHash: "${ADMIN_PASSWORD_HASH:-}"
      # Unset leaves POST /api/episodes disabled rather than unauthenticated.
      Auth__ApiKey: "${API_KEY:-}"

      Maintenance__DeleteSourceAfterTranscription: "${DELETE_SOURCE_AFTER_TRANSCRIPTION:-false}"
      Maintenance__DeleteSourceAfterDays: "${DELETE_SOURCE_AFTER_DAYS:-30}"
      Maintenance__BackupsToKeep: "${BACKUPS_TO_KEEP:-7}"

      # The entrypoint takes ownership of the mounted volumes as these ids, then drops to them.
      # Defaults to the image's own unprivileged user; set them to a host account when the media
      # library lives somewhere shared.
      PUID: "${PUID:-}"
      PGID: "${PGID:-}"

      Storage__DataPath: /data
      Storage__MediaPath: /media
      Storage__MaxUploadMb: "${MAX_UPLOAD_MB:-2048}"
    volumes:
      - ./data:/data
      - ./media:/media
    # Lets Whisper__BaseUrl and Ollama__BaseUrl use host.docker.internal on Linux hosts, where
    # it is not resolvable by default. Harmless if you point at a real hostname or IP instead.
    extra_hosts:
      - "host.docker.internal:host-gateway"
