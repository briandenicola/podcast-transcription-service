name: Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore
      - name: Audit NuGet dependencies
        run: |
          set -o pipefail
          for project in src/PodcastTranscription.Web/PodcastTranscription.Web.csproj tests/PodcastTranscription.Tests/PodcastTranscription.Tests.csproj; do
            dotnet package list --project "$project" --vulnerable --include-transitive --format json --output-version 1 --no-restore | jq -e '[.. | objects | .vulnerabilities? | arrays | .[]? | select((.severity // .Severity // "" | ascii_downcase) as $severity | $severity == "high" or $severity == "critical")] | length == 0'
          done
      - run: dotnet build --no-restore --no-incremental --configuration Release
      # The suite stubs whisper-server over HTTP and uses in-memory SQLite, so it needs neither
      # ffmpeg nor a GPU.
      - run: dotnet test --no-restore --configuration Release
